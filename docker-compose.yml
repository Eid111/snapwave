version: '3.8'

services:
  web:
    build: .
    container_name: snapwave_app
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DEBUG=false
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Set a unique ADMIN_PASSWORD of at least 16 characters}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - TRUST_PROXY=false
    restart: unless-stopped
